name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "dev"

      - uses: dataciviclab/.github/actions/python-ci@main

  preflight:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "pipeline"

      - name: Preflight configs
        run: make check

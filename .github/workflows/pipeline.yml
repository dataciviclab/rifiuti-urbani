name: Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 1 * *'  # Monthly, 1st at 6:00 UTC

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "pipeline"

      - name: Run pipeline
        run: make pipeline

      - name: Update registry
        run: make registry

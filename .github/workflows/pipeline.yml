name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "compose/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "rifiuti-urbani"
      run-command: "make pipeline"
      extra-env: "TOOLKIT_ALLOW_SCRIPT_SOURCE=1"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit

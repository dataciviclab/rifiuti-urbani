root: "../../out"
schema_version: 1

dataset:
  name: "ispra_rs_produzione"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, rs, produzione]
  category: ambiente
  years: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "ispra_rs_produzione_local"
      type: "local_file"
      args:
        path: "../../normalized/rs_produzione/ispra_rs_produzione_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, area_geografica, rs_np_t, rs_p_t, rs_cer_nd_t, totale_t]
  read:
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 50
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_produzione"
      sql: "sql/mart.sql"
  required_tables: [mart_produzione]
  validate:
    table_rules:
      mart_produzione:
        min_rows: 50

validation:
  fail_on_error: true

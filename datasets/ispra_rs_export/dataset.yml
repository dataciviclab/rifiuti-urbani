root: "../../out"
schema_version: 1

dataset:
  name: "ispra_rs_export"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, rs_export]
  category: ambiente
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "ispra_rs_export_normalized"
      type: "local_file"
      args:
        path: "../../normalized/rs_export/ispra_rs_export_{year}.csv"
        filename: "ispra_rs_export_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    [anno, regione, rifiuti_non_pericolosi_t, rifiuti_pericolosi_t, totale_t]
  read:
    source: auto
    mode: latest
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 15
    primary_key: [anno, regione]
    not_null: [anno, regione]
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_import"
      sql: "sql/mart.sql"
  required_tables: [mart_import]
  validate:
    table_rules:
      mart_import:
        primary_key: [anno, regione]
        min_rows: 15

validation:
  fail_on_error: true

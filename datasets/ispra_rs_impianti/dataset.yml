root: "../../out"
schema_version: 1

dataset:
  name: "ispra_rs_impianti"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, rs, impianti]
  category: ambiente
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "ispra_rs_impianti_local"
      type: "local_file"
      args:
        path: "../../normalized/rs_impianti/ispra_rs_impianti_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, area_geografica, numero_impianti, fanghi_t, altri_rs_t, totale_rs_t]
  read:
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 3
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_impianti"
      sql: "sql/mart.sql"
  required_tables: [mart_impianti]
  validate:
    table_rules:
      mart_impianti:
        min_rows: 3

validation:
  fail_on_error: true

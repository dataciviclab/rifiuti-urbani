root: "../../out"
schema_version: 1

dataset:
  name: "ispra_ru_flussi"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, ru, flussi]
  category: ambiente
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage:
    start_year: 2018
    end_year: 2024

raw:
  sources:
    - name: "ispra_ru_flussi_local"
      type: "local_file"
      args:
        path: "../../normalized/flussi/ispra_ru_flussi_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "anno"
    - "regione"
    - "tipo_flusso"
    - "is_aggregato"
    - "quantita_t"
  read:
    all_varchar: true
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    # 20 regioni + riga Italia, per 2 tipi di flusso nel 2018-2019 e 3 dal 2020.
    min_rows: 40
    primary_key: [anno, tipo_flusso, regione]
    not_null: [anno, regione, tipo_flusso]
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_flussi"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_flussi"
  validate:
    table_rules:
      mart_flussi:
        primary_key: [anno, tipo_flusso, regione]
        # 19 regioni con quantità > 0 per l'organico e 16 per incenerimento e
        # discarica: 35 righe nel 2018-2019 (due flussi), 51 dal 2020 (tre).
        min_rows: 30
        required_columns: [quantita_t, tipo_flusso]

validation:
  fail_on_error: true

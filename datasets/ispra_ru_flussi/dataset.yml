root: "../../out"
schema_version: 1

dataset:
  name: "ispra_ru_flussi"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, ru, flussi]
  category: ambiente
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "ispra_ru_flussi_local"
      type: "local_file"
      args:
        path: "../../normalized/flussi/ispra_ru_flussi_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "anno"
    - "regione"
    - "quantita_t"
  read:
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 20
    primary_key: [anno, regione]
    not_null: [anno, regione]
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_flussi"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_flussi"
  validate:
    table_rules:
      mart_flussi:
        primary_key: [anno, regione]
        min_rows: 20
        required_columns: [quantita_t]

validation:
  fail_on_error: true

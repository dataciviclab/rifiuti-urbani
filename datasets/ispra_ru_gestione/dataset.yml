root: "../../out"
schema_version: 1

dataset:
  name: "ispra_ru_gestione"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, ru, impianti, gestione]
  category: ambiente
  description: "Impianti che trattano rifiuti urbani (ISPRA): numero impianti e rifiuti trattati per tipologia impianto e ripartizione geografica."
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "ispra_ru_gestione_local"
      type: "local_file"
      args:
        path: "../../normalized/ru_gestione/ispra_ru_gestione_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns:
    - "anno"
    - "tipo_impianto"
    - "area_geografica"
    - "numero_impianti"
    - "totale_t"
  read:
    header: true
    delim: ";"
    encoding: "utf-8"
    columns:
      tipo_impianto: VARCHAR
      area_geografica: VARCHAR
      numero_impianti: VARCHAR
      frazione_umida_t: VARCHAR
      verde_t: VARCHAR
      tot_ru_t: VARCHAR
      fanghi_t: VARCHAR
      altro_t: VARCHAR
      totale_t: VARCHAR
  validate:
    min_rows: 20
    primary_key: [anno, tipo_impianto, area_geografica]
    not_null: [anno, tipo_impianto, area_geografica, numero_impianti]
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_gestione"
      sql: "sql/mart.sql"
  required_tables: [mart_gestione]
  validate:
    table_rules:
      mart_gestione:
        primary_key: [anno, tipo_impianto, area_geografica]
        min_rows: 15

validation:
  fail_on_error: true

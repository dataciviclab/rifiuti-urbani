root: "../../out"
schema_version: 1

dataset:
  name: "ispra_ru_gestione"
  source_id: "ispra_linked_data"
  tags: [ambiente, ispra, ru, gestione]
  category: ambiente
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "ispra_ru_gestione_local"
      type: "local_file"
      args:
        path: "../../normalized/ru_gestione/ispra_ru_gestione_{year}.csv"
      primary: true
  read:
    header: true
    delim: ";"
    encoding: "utf-8"

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, area_geografica, numero_impianti, frazione_umida_t, verde_t, tot_ru_t, fanghi_t, altro_t, totale_t]
  read:
    header: true
    delim: ";"
    encoding: "utf-8"
  validate:
    min_rows: 20
    promotion:
      max_row_drop_pct: 35
      fail_on_row_drop_exceeded: false

mart:
  tables:
    - name: "mart_gestione"
      sql: "sql/mart.sql"
  required_tables: [mart_gestione]
  validate:
    table_rules:
      mart_gestione:
        min_rows: 5

validation:
  fail_on_error: true

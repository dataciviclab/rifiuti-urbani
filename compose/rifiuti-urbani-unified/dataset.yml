root: "../../out"
schema_version: 1

dataset:
  name: "rifiuti_urbani_unified"
  source_id: "dataciviclab_composite"
  tags: [ambiente, ispra, ru, compose, unified]
  category: ambiente
  description: "Compose RU: vista unificata comuni con RD% + costi + benchmark da ispra-ru-base + ispra-ru-costi-*."
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "ru_base"
      type: local_file
      args:
        path: "../../out/data/mart/ispra_ru_base/{year}/mart_comuni.parquet"
        filename: "ru_base.parquet"
      primary: true

support:
  - type: dataset
    name: costi_procapite
    config: ../../datasets/ispra-ru-costi-procapite/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: costi_kg
    config: ../../datasets/ispra-ru-costi-kg/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - "anno"
    - "codice_comune_istat"
    - "regione"
    - "provincia"
    - "comune"
    - "popolazione"
    - "totale_ru_tonnellate"
    - "totale_rd_tonnellate"
    - "percentuale_rd"
    - "kg_ru_per_abitante"
    - "ctot_euro_ab"
    - "ctot_cent_kg"
  validate:
    not_null:
      - "anno"
      - "codice_comune_istat"
    min_rows: 5000

mart:
  tables:
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - mart_comuni
    - mart_sintesi
  validate:
    table_rules:
      mart_comuni:
        min_rows: 5000
      mart_sintesi:
        min_rows: 50

validation:
  fail_on_error: true

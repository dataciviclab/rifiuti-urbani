root: "../../out"
schema_version: 1

dataset:
  name: "rifiuti_regioni"
  source_id: "dataciviclab_composite"
  tags: [ambiente, ispra, ru, rs, compose, regione]
  category: ambiente
  description: "Compose regionale: RD%, costi, mix impiantistico, movimentazione e rifiuti speciali per regione e anno."
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage:
    start_year: 2018
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "unified"
      type: local_file
      args:
        path: "../../out/data/mart/rifiuti_urbani_unified/{year}/mart_comuni.parquet"
        filename: "unified.parquet"
      primary: true

support:
  - type: dataset
    name: urbani_unified
    config: ../rifiuti-urbani-unified/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: ru_gestione_regionale
    config: ../../datasets/ispra_ru_gestione_regionale/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: ru_import
    config: ../../datasets/ispra_ru_import/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: ru_export
    config: ../../datasets/ispra_ru_export/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: ru_flussi
    config: ../../datasets/ispra_ru_flussi/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: rs_produzione_regionale
    config: ../../datasets/ispra_rs_produzione_regionale/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  - type: dataset
    name: rs_gestione_regionale
    config: ../../datasets/ispra_rs_gestione_regionale/dataset.yml
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - "anno"
    - "regione"
    - "popolazione"
    - "totale_ru_tonnellate"
    - "percentuale_rd"
    - "ctot_euro_ab"
  validate:
    primary_key: [anno, regione]
    not_null:
      - "anno"
      - "regione"
    min_rows: 15

mart:
  tables:
    - name: "mart_regioni"
      sql: "sql/mart_regioni.sql"
  required_tables:
    - mart_regioni
  validate:
    table_rules:
      mart_regioni:
        primary_key: [anno, regione]
        min_rows: 15

validation:
  fail_on_error: true
